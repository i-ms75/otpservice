spring.application.name=otpservice

# Health check probes SMTP on every poll and fails on transient mail issues;
# OTP sending is on-demand, so it shouldn't gate the container's health.
management.health.mail.enabled=false

# Secrets are injected via environment variables (see .env / docker compose),
# so they stay out of the image. Set them in your shell for local non-Docker runs.
approvers=${APPROVERS}
#approvers=shaktibachatsamuh@gmail.com,indradev319@gmail.com,Idk.cok01@gmail.com
# Gmail SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

# Security & Authentication
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}

pepper=${PEPPER}
