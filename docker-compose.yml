services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${SPRING_DATA_REDIS_PASSWORD}"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SPRING_DATA_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    # Image is built and pushed by CI; the box only pulls it. Falls back to the
    # GHCR latest tag for ad-hoc local `docker compose up`.
    image: ${IMAGE:-ghcr.io/i-ms75/otpservice}:${IMAGE_TAG:-latest}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Cap the container so -XX:MaxRAMPercentage (75%) sizes the heap against this
    # limit, not the whole host — leaves room for a second service on the t4g.medium.
    mem_limit: 768m
    environment:
      # Connection to the redis service in this compose network
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      # Mail / app secrets — supplied via .env, not baked into the image
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      PEPPER: ${PEPPER}
      APPROVERS: ${APPROVERS}

volumes:
  redis-data:
